name: albion_tracker_mobile
description: Mobile companion for AlbionOnline-StatisticsAnalysis. Displays the same data captured by the PC host in real-time.

publish_to: 'none'

version: 1.0.0+5

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  signalr_netcore: ^1.3.7
  provider: ^6.1.2
  cached_network_image: ^3.3.1
  intl: ^0.20.2
  fl_chart: ^0.69.0
  shared_preferences: ^2.3.3
  connectivity_plus: ^6.1.0
  qr_flutter: ^4.1.0
  shimmer: ^3.0.0
  path_provider: ^2.1.4
  gal: ^2.3.0
  url_launcher: ^6.3.1
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/app_icon.png"
  min_sdk_android: 21
  windows:
    generate: true
    icon_size: 48
    image_path: "assets/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
